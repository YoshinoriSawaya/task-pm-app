# 本番環境のみで使用するリバースプロキシ設定(ADR-0003)。
# インフラ層のBasic認証をここでかけ、フロント(Vite dev server)・バックエンド(Laravel)を
# 同一オリジン(このnginxのport 80)で配信する。同一オリジンにすることでCORSも実質不要になる
# (backend/config/cors.phpのコメント、docs/development/coding-standards.md「CORS」参照)。
# .htpasswdはリポジトリにコミットしない(デプロイ時に生成、change-log.md参照)。
server {
    listen 80;

    auth_basic "task-pm-app";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravelのヘルスチェックエンドポイント(bootstrap/app.phpのhealth: '/up')。
    # 監視・デプロイ確認用に、こちらもBasic認証なしで到達できるようにする
    location = /up {
        auth_basic off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vite dev serverのHMR(ホットリロード)用WebSocketアップグレード対応
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
