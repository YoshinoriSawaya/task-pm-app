services:
  frontend:
    image: node:20-alpine
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: task_pm_app
      DB_USERNAME: task_pm_app
      DB_PASSWORD: secret
      FRONTEND_URL: http://localhost:5173
      # php artisan serveはデフォルトでは1リクエストずつ直列処理してしまい、
      # ブラウザからの複数同時リクエスト(React StrictModeの二重effect等)で
      # 顕著な待ち時間が発生する。PHP組み込みサーバーの並列ワーカー機能で緩和する
      PHP_CLI_SERVER_WORKERS: "4"
    command: >
      sh -c "
        [ -f .env ] || cp .env.example .env &&
        composer install &&
        php artisan key:generate --ansi --force &&
        php artisan migrate --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: task_pm_app
      MYSQL_USER: task_pm_app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    # depends_onはコンテナの起動開始しか待たず、MySQL自体が接続を受け付ける
    # 準備ができているかは見ない。CIのようにイメージpull直後で起動が遅い環境だと
    # backendのmigrateが接続拒否で失敗しうるため、実際に接続可能になるまで
    # ヘルスチェックで待つ(change-log.md C16)。
    # 公式MySQLイメージは初期化中、`--skip-networking`(TCP未リッスン)の一時
    # サーバーをUnixソケット経由でのみ起動する。mysqladminは`-h localhost`
    # 指定時にソケット接続を優先するため、`-h localhost`のままだとこの一時
    # サーバーに対しても誤って「healthy」と判定しかねない(/code-review指摘)。
    # `127.0.0.1`+`--protocol=tcp`で明示的にTCP接続を強制し、本当にbackendが
    # 接続する経路(DB_HOST=db、TCP)の疎通を確認する
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "--protocol=tcp",
          "-u",
          "root",
          "-proot",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data:
