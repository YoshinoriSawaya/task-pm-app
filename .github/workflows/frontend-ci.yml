name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prettier --check .
      - run: npm run lint
      # ルートのtsconfig.json(references専用、filesは空)を対象にすると
      # 実質チェック対象0件で常に成功してしまうため、--build(-b)で
      # tsconfig.app.json/tsconfig.node.json/tsconfig.test.jsonを実際に辿らせる
      - run: npx tsc -b
      - run: npm test
